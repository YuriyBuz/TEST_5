<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оцінка Компетенцій: Контролер Якості (Виробництво Соусів)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --primary: #0284c7; --danger: #dc2626; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; padding-bottom: 2rem; }
        .card { background-color: var(--card-bg); border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .option-btn { transition: all 0.2s; border: 2px solid #e2e8f0; position: relative; }
        .option-btn:not(.disabled):hover { border-color: var(--primary); background-color: #f0f9ff; }
        .option-btn.correct-choice { border-color: var(--primary) !important; background-color: #e0f2fe !important; }
        .option-btn.wrong-choice { border-color: var(--danger) !important; background-color: #fef2f2 !important; }
        .option-btn.disabled { cursor: default; opacity: 0.7; }
        .feedback-box { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
        .spinner { animation: rotate 2s linear infinite; width: 16px; height: 16px; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="container mx-auto max-w-2xl p-4 sm:p-6">
        <header class="text-center mb-6 pt-4">
            <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt="Логотип" class="w-24 h-auto mx-auto mb-4 rounded-xl shadow-sm bg-white p-1" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23eee\'/><text x=\'50\' y=\'50\' font-family=\'Arial\' font-size=\'14\' text-anchor=\'middle\' dy=\'.3em\' fill=\'%23999\'>Logo</text></svg>'">
            <div class="flex items-center justify-center gap-2 mb-1">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-green-500"></div>
                <span id="statusText" class="text-xs font-bold text-slate-500 uppercase tracking-widest">Онлайн</span>
            </div>
            <h1 class="text-2xl font-bold text-sky-800">Атестація: Контролер Якості</h1>
            <p class="text-slate-500 text-sm">Виробництво соусів | Лабораторія, HACCP, Санітарія</p>
        </header>

        <div id="step-login" class="card p-6 rounded-2xl">
            <div class="bg-sky-50 border-l-4 border-sky-500 p-4 mb-6">
                <h3 class="font-bold text-sky-800 text-sm">Інформація:</h3>
                <p class="text-xs text-sky-700 mt-1">Тестування містить профільні задачі підвищеної складності (8.5/10). Результати записуються в базу. Прохідний бал: 18 правильних відповідей з 20.</p>
            </div>
            <label class="block text-sm font-bold mb-2 text-slate-700">Оберіть ПІБ:</label>
            <select id="employeeSelect" class="w-full p-3 border border-gray-300 rounded-xl bg-white text-lg focus:outline-none focus:ring-2 focus:ring-sky-500 mb-6"><option value="">-- Натисніть для вибору --</option></select>
            <button onclick="startTest()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95">РОЗПОЧАТИ ОЦІНКУ</button>
        </div>

        <div id="step-quiz" class="hidden">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-xs font-bold text-slate-400 uppercase">Питання <span id="q-current">1</span> / <span id="q-total-counter">0</span></span>
                <div class="w-1/2 bg-gray-200 rounded-full h-2"><div id="progress-bar" class="bg-sky-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div></div>
            </div>
            <div class="card p-6 rounded-2xl min-h-[420px] flex flex-col justify-between">
                <div>
                    <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-800 leading-tight"></h2>
                    <div id="options-container" class="space-y-3"></div>
                    <div id="feedback-container" class="hidden mt-6 feedback-box">
                        <div id="feedback-type" class="p-4 rounded-xl border-l-4">
                            <div class="flex items-center mb-1"><span id="feedback-icon" class="mr-2"></span><span id="feedback-title" class="font-bold"></span></div>
                            <p id="feedback-text" class="text-sm italic"></p>
                        </div>
                    </div>
                </div>
                <button id="next-btn" onclick="nextQuestion()" disabled class="mt-8 w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl cursor-not-allowed transition">Наступне питання</button>
            </div>
        </div>

        <div id="step-result" class="hidden text-center">
            <div class="card p-8 rounded-3xl">
                <div id="sync-indicator" class="mb-4 text-[10px] font-black uppercase tracking-tighter text-amber-500 flex items-center justify-center gap-2"><span>Синхронізація...</span><div class="spinner border-2 border-amber-500 border-t-transparent rounded-full"></div></div>
                <div id="icon-result" class="text-6xl mb-4"></div>
                <h2 id="title-result" class="text-3xl font-bold mb-1"></h2>
                <div class="py-6 my-4 border-y border-slate-100"><p class="text-5xl font-black text-slate-800"><span id="score-val">0</span> / <span id="score-total">0</span></p><p id="percentage-val" class="text-sm font-bold text-sky-600 mt-2 bg-sky-50 inline-block px-3 py-1 rounded-full"></p></div>
                <p id="msg-result" class="text-base mb-8 px-4 text-slate-500 leading-relaxed"></p>
                <div class="mb-8 flex justify-center"><div id="qrcode" class="p-2 bg-white border rounded-xl"></div></div>
                <button onclick="location.reload()" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition">Повернутися на головну</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkzOkyk2zwObyZThhZE1ACAPYAtwPMZsSoUij9yHw_vEKgmkImUOCVlk-F_SH06b_w/exec';
        const OFFLINE_QUEUE_KEY = 'sauce_safety_offline_queue_qc';
        
        // Актуально на 07.09.2026. Джерело істини — довідник працівників.
        // Використовується лише як резерв: при вході з порталу ПІБ приходить
        // із самого порталу (див. блок підтвердження особи внизу файлу).
        const employeesList = [
            "Огаркова Марія Володимирівна",
            "Попадюк Анжела Миколаївна",
            "Соботович Лілія Михайлівна"
        ];

        // 20 запитань (складність 8.5/10). Всі варіанти відповідей ідеально збалансовані по довжині та термінології.
        const originalQuestions = [
            { q: "Вхідний контроль: Brix партії томатної пасти становить 34 замість 36 за специфікацією. Ваші дії?", a: ["Прийняти партію в роботу з відміткою в технологічному журналі, оскільки під час варіння соусу маса все одно уварюється до цільового показника.", "Забракувати сировину, або ініціювати офіційну процедуру тимчасового відхилення (Concession) з обов'язковою комісійною оцінкою ризиків для якості.", "Прийняти партію та письмово повідомити оператора варіння про необхідність перерахунку рецептури, щоб додати менше води згідно з пропорцією."], ci: 1, h: "Сировина, що не відповідає специфікації, не може бути прийнята 'на око'. Тільки офіційна процедура відхилення з підписом відповідальних осіб гарантує контроль витрат і якості." },
            { q: "ХВО: Жорсткість води після натрій-катіонітового пом'якшувального фільтра раптово зросла з 0.1 до 1.5 мг-екв/л. Який головний ризик для виробництва майонезу?", a: ["Відбудеться швидке утворення кальцієвого накипу в трубопроводах, що неминуче призведе до зниження ефективності теплообмінників у пастеризаторі.", "Надмірна концентрація іонів кальцію та магнію вступає в реакцію з компонентами та призводить до руйнування емульсії (синерезису готового соусу).", "Відбудеться непередбачувана хімічна реакція з гідроколоїдами (крохмалем), через що майонез набуде занадто густої, желеподібної консистенції."], ci: 1, h: "Солі жорсткості негативно впливають на стабільність жироводних емульсій. Це критичний параметр для майонезної групи." },
            { q: "Фіз-хімія (рН): Під час вимірювання рН густого майонезного соусу покази на рН-метрі постійно 'плавають' і не стабілізуються. Ваша найімовірніша дія для отримання точного результату?", a: ["Згідно з лабораторною методикою, необхідно розбавити зразок дистильованою водою (зазвичай 1:10), ретельно перемішати та провести повторний замір.", "Ретельно гомогенізувати зразок за допомогою лабораторного блендера і швидко провести вимірювання електродним методом до початку розшарування.", "Збільшити температуру зразка на водяній бані до 45-50°C для зменшення в'язкості емульсії та пришвидшення стабілізації показників на екрані приладу."], ci: 0, h: "Густі жирові емульсії обволікають електрод, що блокує обмін іонів. Для точного вимірювання рН за ДСТУ/ISO такі продукти розбавляють дистильованою водою (1:10 або 1:1), що вивільняє іони водню." },
            { q: "Санітарія (змиви): Після CIP-мийки ви перевіряєте промивну воду індикаторними рН-смужками на залишки лугу. Підготовлена вода має рН 7.0, а змивна вода з котла показує рН 8.5. Ваші дії?", a: ["Дозволити запуск лінії, оскільки показник рН 8.5 класифікується як слабколужне середовище, яке повністю нейтралізується кислотністю самого соусу.", "Заблокувати запуск обладнання та провести додаткове промивання чистою водою, поки рН змивної води повністю не зрівняється з рН води з крана.", "Призначити додаткову обробку котла слабким розчином лимонної або оцтової кислоти, щоб швидко нейтралізувати залишки лугу та знизити рН до 7.0."], ci: 1, h: "Значення рН останньої промивної води повинно точно відповідати рН чистої води, що подається на підприємство. Будь-яке відхилення свідчить про наявність залишків мийних засобів." },
            { q: "Облік хімії: Оператор цеху просить налити йому 2 літри азотної кислоти у звичайне пластикове відро для локального відмивання сильних забруднень підлоги. Ваше рішення?", a: ["Не видати. Азотна кислота призначена виключно для закритих систем CIP-миття. Використання немаркованої відкритої тари є грубим порушенням процедур.", "Видати необхідний об'єм під підпис, але обов'язково провести цільовий інструктаж з техніки безпеки та суворо проконтролювати використання ЗІЗ.", "Дозволити використання, але виключно за умови використання стійкої тари (наприклад, спеціального скла), щоб уникнути розплавлення пластикового відра."], ci: 0, h: "Категорично заборонено використовувати CIP-кислоти для відкритого ручного миття (високий ризик опіків парами/рідиною) та використовувати немарковану/невідповідну тару." },
            { q: "Контроль на лінії (Фасування): Під час фасування соусу в пакет 'Дой-пак' ви помітили, що зварний шов має мікроскладки (зморшки), хоча герметичність при натисканні рукою не порушена.", a: ["Дозволити подальше фасування, оскільки візуальні мікроскладки є допустимим відхиленням, а ручний тест на стискання підтверджує герметичність пакету.", "Негайно зупинити лінію та відбракувати продукцію. Наявність мікроскладок створює критичний ризик капілярного протікання та мікробіологічного псування.", "Негайно збільшити температуру зварювальних губок на 15-20°C для кращого плавлення плівки і продовжити фасування без зупинки лінії та відбраковування."], ci: 1, h: "Мікроскладки на шві (канали) є критичним дефектом пакування. Навіть якщо пакет не тече одразу, через капілярний ефект всередину можуть потрапити мікроорганізми з навколишнього середовища." },
            { q: "Органолептика: Всі лабораторні показники (pH, Brix, в'язкість) нової партії кетчупу в нормі, але ви відчуваєте сторонній гіркуватий присмак. Що робити?", a: ["Надати офіційний дозвіл на фасування, спираючись на те, що всі специфіковані приладами фізико-хімічні параметри знаходяться в суворих межах допусків.", "Тимчасово заблокувати партію та обов'язково зібрати дегустаційну комісію (мінімум 3 особи) для сліпого порівняння з затвердженим еталонним зразком.", "Ініціювати технологічне коригування рецептури шляхом додавання розрахункової кількості цукрового сиропу безпосередньо у танк для маскування гіркоти."], ci: 1, h: "Органолептика є таким же повноцінним показником якості, як і фізико-хімія. При відхиленні потрібне колегіальне рішення комісії." },
            { q: "Вихідний контроль: На складі готової продукції виявлено палету майонезу, де на 5 коробках змазане струйне маркування (не читається дата і номер партії).", a: ["Дозволити відвантаження цієї палети на склад, оскільки загальний палетний штрих-код чудово читається сканером і містить всю необхідну інформацію.", "Заблокувати палету в обліковій системі (статус 'БРАК' або 'КАРАНТИН') та відправити на офіційне перемаркування чи перепакування дефектних коробок.", "Власноруч або за допомогою вільного оператора відновити нечитабельну інформацію незмивним маркером на дефектних коробках, щоб не затримувати процес."], ci: 1, h: "Відсутність чіткого маркування на споживчій або груповій тарі руйнує простежуваність (traceability), що є порушенням ISO 22000 / IFS." },
            { q: "В'язкість (Боствік): В'язкість гарячого соусу знаходиться на верхній межі норми (дуже густий). Варник пропонує додати води, щоб 'вирівняти' партію.", a: ["Заборонити. В'язкість соусів з гідроколоїдами після стабілізації значно зміниться, орієнтуватися треба виключно на профіль холодної дегустації.", "Погодити це рішення, оскільки додавання кип'яченої або очищеної води на етапі гарячого варіння при 85°C жодним чином не впливає на безпеку продукту.", "Заборонити використання води для розведення, але дозволити оператору додати додаткову розрахункову дозу крохмалю для стабілізації загальної маси партії."], ci: 0, h: "Гаряча в'язкість — це лише технологічний орієнтир. Рішення про розведення приймається тільки технологом на основі кореляції гарячого/холодного зразка." },
            { q: "Контроль ваги (Нетто): Під час перевірки ваги фасованого соусу ви виявили, що середня вага партії в нормі, але дві упаковки з десяти мають недолив більший за межу (подвійна похибка). Ваше рішення?", a: ["Продовжити фасування без змін, оскільки згідно з нормативними документами головним критерієм є відповідність середньої ваги всієї партії номіналу.", "Зупинити лінію, відбракувати всю вироблену з останньої перевірки партію, ініціювати переналаштування дозатора та суцільне перезважування продукції.", "Скоригувати дозатор на збільшення дози (додати по 5-10 грамів) у наступні вибірки упаковок для вирівнювання загального вагового балансу поточної партії."], ci: 1, h: "За правилами фасування (Директива 76/211/ЄЕС/e-mark), наявність упаковок з недоливом нижче межі є критичною невідповідністю. Партія підлягає блокуванню." },
            { q: "Мікробіологія: Під час термостатної проби (при 37°C) одного зразка 'Дой-пак' на 3-й день виявлено здуття (бомбаж), без зміни запаху.", a: ["Зафіксувати це як нормальне фізичне розширення повітряної подушки при нагріванні в термостаті та продовжити стандартне спостереження до повних 7 днів.", "Негайно заблокувати партію, а зразки направити на глибокий мікробіологічний посів через підозру на активний розвиток газоутворюючих мікроорганізмів.", "Обережно проколоти стерильною голкою здуту упаковку в умовах лабораторії, щоб випустити накопичений газ і додатково перевірити показник рН та запах."], ci: 1, h: "Здуття упаковки в термостаті — перша ознака мікробіологічного псування (напр. молочнокислі бактерії або дріжджі). Партія потенційно небезпечна." },
            { q: "Вхідний контроль (Документація): Приймаючи партію сухого часнику, ви виявили, що в Сертифікаті аналізу (CoA) відсутній показник тестування на сальмонелу, який є обов'язковим за вашою специфікацією.", a: ["Прийняти партію сировини на склад, але в обов'язковому порядку зробити власний внутрішній експрес-тест на сальмонелу перед безпосереднім пуском у роботу.", "Перевести партію в статус 'Карантин', ізолювати її та терміново зробити запит постачальнику на оновлений сертифікат з результатами мікробіології.", "Скласти акт про критичну невідповідність, забракувати партію і негайно повернути машину постачальнику без надання йому можливості дослати документи."], ci: 1, h: "Відсутність критичного показника безпеки у супровідній документації не дозволяє випустити сировину у виробництво. Вона має бути заблокована (карантин) до з'ясування обставин." },
            { q: "Контроль процесів (Майонез): При відборі проби готового майонезного соусу ви помітили високу 'завоздушеність' (наявність дрібних бульбашок повітря в структурі). Який основний ризик це несе?", a: ["Пришвидшене окислення жирів (згіркнення смаку) та потенційний критичний недолив у грамах при об'ємному фасуванні через суттєве зменшення щільності.", "Надмірна кількість кисню в структурі емульсії буде активно сприяти швидкому розмноженню небезпечних анаеробних патогенних мікроорганізмів всередині.", "За рахунок повітряних кишень фізична структура майонезу стане суттєво більш густою і щільною, що значно ускладнить його видавлювання кінцевим споживачем."], ci: 0, h: "Завоздушеність майонезу є серйозним дефектом: кисень спричиняє окислення олії (псування смаку), а бульбашки зменшують питому вагу, через що об'ємний дозатор наллє меншу вагу нетто." },
            { q: "Санітарія (Алергени): Після переходу лінії з кунжутного соусу (містить алерген) на томатний (без алергену) виявлено дві насінини кунжута в ВК. Дії?", a: ["Дозволити запуск лінії, але за умови, що перші 50-100 кг томатного соусу будуть зібрані в окремі марковані каністри для подальшої безпечної переробки.", "Категорично заблокувати запуск. Провести повторне повне миття проблемних вузлів обладнання до отримання повністю негативного тесту на залишки білка.", "Додати в систему циркуляції води для повторної мийки підвищену концентрацію азотної кислоти (близько 5%) для повного хімічного розкладання алергенів."], ci: 1, h: "Залишки алергенів неможливо 'злити' або 'знешкодити'. Потрібне виключно ретельне фізико-хімічне змивання (CIP) та підтвердження тестом." },
            { q: "Облік засобів: При звірці залишків у кінці зміни виявлено нестачу 2 літрів концентрованої надоцтової кислоти (НОК).", a: ["Оформити офіційний акт на списання цього об'єму хімії як природний технологічний убуток через випаровування концентрованих речовин у процесі зберігання.", "Негайно ініціювати розслідування інциденту, оскільки існує дуже серйозний ризик несанкціонованого використання, небезпечного розливу або саботажу.", "Тимчасово долити 2 літри дистильованої води в неповну каністру, щоб фактичний об'єм зійшовся з обліковим перед процедурою передачі зміни наступній бригаді."], ci: 1, h: "Контроль хімікатів (Хімічна безпека/Food Defense) вимагає суворого балансу. Втрата концентрату — це надзвичайна подія." },
            { q: "Контроль процесів (Охолодження): Через поломку насоса готовий кетчуп (85°C) стоїть у накопичувальній ємності вже 2 години без охолодження. Який ризик?", a: ["Через тривалий температурний вплив відбудеться деструкція модифікованого крохмалю, внаслідок чого готовий продукт стане занадто рідким та втратить форму.", "Відбудеться активна реакція Майяра та карамелізація — соус суттєво потемніє і з'явиться специфічний горілий присмак, відомий як технологічний 'тепловий удар'.", "Суттєво зросте ризик активізації та швидкого розвитку термофільних спороутворюючих бактерій, які здатні виживати і розмножуватися при екстремальних температурах."], ci: 1, h: "Тривалий вплив високих температур після варіння призводить до так званого 'теплового удару'. Продукт змінює колір на темний і набуває присмаку паленого цукру (реакція Майяра)." },
            { q: "Вихідний контроль (Транспорт): Влітку прибув рефрижератор для завантаження майонезу. Температура в кузові +28°C (вимога: 0...+18°C).", a: ["Дозволити завантаження в прискореному режимі, оскільки маса продукту всередині щільно запакованої палети має велику теплоємність і не встигне нагрітися.", "Здійснити завантаження згідно з графіком, але обов'язково зробити офіційну відмітку в товаро-транспортній накладній для попередження клієнта про ризики.", "Категорично відмовити в завантаженні та заблокувати процес, доки водій не увімкне установку і кузов повністю не охолодиться до специфікованої температури."], ci: 2, h: "Завантаження в 'гарячий' кузов заборонено температурним протоколом, оскільки майонез вкрай чутливий до перегріву (втрата емульсії)." },
            { q: "Фіз-хімія: рН готового майонезу в танку 4.4 (при нормі макс. 4.2). Варник пропонує просто долити оцтову кислоту в танк і перемішати лопастною мішалкою.", a: ["Так, можна погодити цю дію, оскільки додавання невеликої кількості кислоти безпосередньо у танк є стандартною і швидкою практикою технологічного коригування.", "Ні. Введення кислоти в готову емульсію без проходження через гомогенізатор зруйнує структуру. Партія є невідповідною і підлягає переробці за протоколом.", "Це можливо реалізувати, але виключно за умови, якщо разом з розчином оцтової кислоти буде додано сухий яєчний жовток для посилення властивостей емульгатора."], ci: 1, h: "Майонез (емульсія типу олія-у-воді) дуже чутливий до локальних змін рН. Просте вливання кислоти 'спалить' емульгатор, що призведе до виділення олії." },
            { q: "Санітарія та Безпека (Скло): Під час фасування соусу в скляні пляшки одна з них розбилася на конвеєрі під наповнювачем. Який алгоритм дій контролера якості?", a: ["Зупинити фасувальну машину, швидко зібрати уламки скла технічною щіткою, ретельно протерти конвеєрну стрічку вологою серветкою і одразу запустити лінію.", "Використати цеховий шланг для змивання уламків скла водою під високим тиском безпосередньо в найближчий каналізаційний трап, після чого продовжити роботу.", "Зупинити лінію, ізолювати продукцію в радіусі згідно з процедурою, очистити зону спеціальним інвентарем (червоним) та забракувати всю відкриту тару поруч."], ci: 2, h: "Процедура управління биттям скла вимагає повної зупинки, блокування прилеглої продукції (через ризик розльоту мікроуламків) та використання виділеного інвентарю для прибирання." },
            { q: "Документація (HACCP): Ви помітили, що варник переписує показники температурних режимів за всю зміну в завдання на варку 'по пам'яті' за 10 хвилин до кінця зміни.", a: ["Це припустиме відхилення від процедури, якщо збережені електронні тренди в пам'яті комп'ютера (ПЛК) повністю підтверджують дотримання температурних режимів.", "Категорично заборонити. Це пряма фальсифікація записів. Згідно з вимогами HACCP, моніторинг критичних точок має здійснюватися виключно в режимі реального часу.", "Втрутитися в ситуацію та перевірити правильність внесених цифр разом з оператором, щоб переконатися у відсутності помилок і пришвидшити процес передачі зміни."], ci: 1, h: "Заповнення завдань на варку 'заднім числом' є найгрубішим порушенням принципів HACCP і може стати причиною позбавлення сертифіката (IFS/FSSC)." }
        ];

        let currentQIndex = 0, score = 0, userName = "", selectedOptionIndex = null, testLog = [], currentOptions = [];

        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('employeeSelect');
            employeesList.sort((a, b) => a.localeCompare(b, 'uk')).forEach(name => { 
                const opt = document.createElement('option'); 
                opt.value = name; 
                opt.textContent = name; 
                select.appendChild(opt); 
            });
            document.getElementById('q-total-counter').innerText = originalQuestions.length;
            
            updateNetworkStatus();
            window.addEventListener('online', () => { updateNetworkStatus(); processOfflineQueue(); });
            window.addEventListener('offline', updateNetworkStatus);
        });

        function shuffle(a) { 
            for (let i = a.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [a[i], a[j]] = [a[j], a[i]]; 
            } 
            return a; 
        }

        function startTest() { 
            userName = document.getElementById('employeeSelect').value; 
            if (!userName) { alert("Будь ласка, оберіть ПІБ зі списку."); return; } 
            document.getElementById('step-login').classList.add('hidden'); 
            document.getElementById('step-quiz').classList.remove('hidden'); 
            renderQuestion(); 
        }

        function renderQuestion() {
            const q = originalQuestions[currentQIndex];
            document.getElementById('q-current').innerText = currentQIndex + 1;
            document.getElementById('progress-bar').style.width = `${(currentQIndex / originalQuestions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('feedback-container').classList.add('hidden');
            
            const container = document.getElementById('options-container'); 
            container.innerHTML = '';
            
            const nextBtn = document.getElementById('next-btn'); 
            nextBtn.disabled = true;
            nextBtn.className = "mt-8 w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl cursor-not-allowed transition";
            nextBtn.innerText = currentQIndex === originalQuestions.length - 1 ? "Завершити тестування" : "Наступне питання";
            
            currentOptions = q.a.map((text, i) => ({ text, isCorrect: i === q.ci }));
            shuffle(currentOptions);
            
            currentOptions.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl text-lg flex items-center mb-2 leading-tight';
                btn.innerHTML = `<span class="w-8 h-8 rounded-full border-2 border-slate-200 flex-shrink-0 flex items-center justify-center mr-3 text-xs font-bold text-slate-400">${String.fromCharCode(65 + i)}</span> <span>${opt.text}</span>`;
                btn.onclick = () => showFeedback(i, btn);
                container.appendChild(btn);
            });
        }

        function showFeedback(idx, btn) {
            if (selectedOptionIndex !== null) return;
            selectedOptionIndex = idx;
            const isCorrect = currentOptions[idx].isCorrect;
            
            if (isCorrect) { 
                score++; 
                btn.classList.add('correct-choice'); 
                testLog.push('✅'); 
            } else { 
                btn.classList.add('wrong-choice'); 
                testLog.push('❌'); 
                document.querySelectorAll('.option-btn').forEach((b, i) => { 
                    if (currentOptions[i].isCorrect) b.classList.add('correct-choice'); 
                }); 
            }
            
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
            
            const fbox = document.getElementById('feedback-container');
            const ftype = document.getElementById('feedback-type');
            const ficon = document.getElementById('feedback-icon');
            const ftitle = document.getElementById('feedback-title');
            const ftext = document.getElementById('feedback-text');
            
            fbox.classList.remove('hidden'); 
            ftext.innerText = originalQuestions[currentQIndex].h;
            
            if (isCorrect) { 
                ftype.className = "p-4 rounded-xl border-l-4 border-sky-500 bg-sky-50 text-sky-800"; 
                ficon.innerText = "✅"; 
                ftitle.innerText = "Абсолютно вірно!"; 
            } else { 
                ftype.className = "p-4 rounded-xl border-l-4 border-red-500 bg-red-50 text-red-800"; 
                ficon.innerText = "❌"; 
                ftitle.innerText = "Помилка контролю!"; 
            }
            
            const nextBtn = document.getElementById('next-btn'); 
            nextBtn.disabled = false; 
            nextBtn.className = "mt-8 w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95";
        }

        function nextQuestion() { 
            selectedOptionIndex = null; 
            currentQIndex++; 
            if (currentQIndex < originalQuestions.length) renderQuestion(); 
            else showResults(); 
        }

        function showResults() {
            document.getElementById('step-quiz').classList.add('hidden'); 
            document.getElementById('step-result').classList.remove('hidden');
            
            const total = originalQuestions.length;
            const pct = Math.round((score / total) * 100);
            const passed = score >= 18; // 18 з 20 для проходження
            
            document.getElementById('score-val').innerText = score; 
            document.getElementById('score-total').innerText = total;
            document.getElementById('percentage-val').innerText = `${pct}% Правильних відповідей`;
            
            const icon = document.getElementById('icon-result');
            const title = document.getElementById('title-result');
            const msg = document.getElementById('msg-result');
            
            if (passed) { 
                icon.innerText = "🔬"; 
                title.innerText = "Компетенцію Підтверджено"; 
                title.className = "text-3xl font-black mb-1 text-sky-600"; 
                msg.innerText = "Чудова робота! Ви продемонстрували високий рівень знань політик якості, HACCP та лабораторного контролю. Дані збережено."; 
            } else { 
                icon.innerText = "⚠️"; 
                title.innerText = "Атестацію Не Складено"; 
                title.className = "text-3xl font-black mb-1 text-red-600"; 
                msg.innerText = `Цільовий бал: 18. Ваш результат: ${score}. Рекомендується повторне вивчення стандартів підприємства та політик харчової безпеки перед перездачею.`; 
            }
            
            const payload = { 
                formType: 'QC_INSPECTOR_COMPETENCY', 
                name: userName, 
                score: score, 
                total: total, 
                percent: pct, 
                passed: passed, 
                details: testLog.join(' '), 
                date: new Date().toISOString() 
            };
            
            sendToGAS(payload);
            
            const qrText = `QC_AUTH:${userName}|${score}/${total}|${passed?'PASS':'FAIL'}|${testLog.join('')}`;
            try { 
                new QRCode(document.getElementById("qrcode"), { text: qrText, width: 140, height: 140, correctLevel : QRCode.CorrectLevel.L }); 
            } catch (e) { console.error("QR Code Error:", e); }
        }

        function sendToGAS(p) {
            if (!navigator.onLine) { saveToOffline(p); return; }
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) })
            .then(() => document.getElementById('sync-indicator').innerHTML = '<span class="text-sky-500 font-bold uppercase tracking-widest text-[10px]">✅ Збережено на сервер</span>')
            .catch(() => saveToOffline(p));
        }

        function saveToOffline(p) { 
            const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); 
            q.push(p); 
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); 
            document.getElementById('sync-indicator').innerHTML = '<span class="text-amber-500 font-bold uppercase tracking-widest text-[10px]">📵 Збережено офлайн (чекаємо інтернет)</span>'; 
        }

        async function processOfflineQueue() {
            if (!navigator.onLine) return; 
            const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); 
            if (q.length === 0) return;
            
            document.getElementById('sync-indicator').innerHTML = '<span class="text-amber-500 font-bold uppercase tracking-widest text-[10px]">Синхронізація офлайн даних...</span>';
            for (const p of [...q]) { 
                try { 
                    await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) }); 
                    q.shift(); 
                } catch (e) { break; } 
            }
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); 
            updateNetworkStatus();
            document.getElementById('sync-indicator').innerHTML = '<span class="text-sky-500 font-bold uppercase tracking-widest text-[10px]">✅ Всі дані синхронізовано</span>';
        }

        function updateNetworkStatus() { 
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText'); 
            if (!navigator.onLine) { 
                dot.className = 'w-2 h-2 rounded-full bg-red-500'; 
                txt.textContent = 'Офлайн'; 
            } else { 
                dot.className = 'w-2 h-2 rounded-full bg-green-500'; 
                txt.textContent = 'Онлайн'; 
            } 
        }
    </script>

    <!-- ================= ПОРТАЛ: підтвердження особи (SSO) =================
         Тест відкривається з порталу з одноразовим токеном ?pt=...
         Портал повертає ПІБ -> список ПІБ підміняється однією підтвердженою
         людиною і блокується. Ніхто не може пройти тест "за іншого".
         Цей блок однаковий у всіх 6 тестах — правити треба всюди одночасно.
    ===================================================================== -->
    <script>
    (function () {
        // Backend порталу (Apps Script). Той самий деплой, що і в порталі.
        var PORTAL_API = 'https://script.google.com/macros/s/AKfycbzYLX7Rc3jfg1zH_DW_Qbx3uiAK38T9aojJiCwVKSX2-3zej4ScsuC9aFeKcYMNcVfzVA/exec';
        var PORTAL_URL = 'https://yuriybuz.github.io/portal/';

        // ПЕРЕМИКАЧ РЕЖИМУ:
        //   false — як зараз: без ?pt= працює старий список ПІБ (там є звільнені).
        //   true  — тест відкривається ТІЛЬКИ з порталу; прямі посилання
        //           блокуються, список ПІБ не використовується взагалі
        //           ("мертві душі" зникають повністю).
        var REQUIRE_PORTAL = true;

        var pt = null;
        try { pt = new URLSearchParams(location.search).get('pt'); } catch (e) { pt = null; }

        function ready(fn) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', fn, { once: true });
            } else {
                fn();
            }
        }

        function note(text, color) {
            var sel = document.getElementById('employeeSelect');
            if (!sel || !sel.parentNode) return;
            var p = document.getElementById('portal-sso-note');
            if (!p) {
                p = document.createElement('p');
                p.id = 'portal-sso-note';
                p.style.cssText = 'font-size:13px;margin:8px 0 0;line-height:1.4;';
                sel.parentNode.insertBefore(p, sel.nextSibling);
            }
            p.style.color = color;
            p.innerHTML = text;
        }

        function lockTo(name) {
            var sel = document.getElementById('employeeSelect');
            if (!sel) return;
            sel.innerHTML = '';
            var opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            sel.appendChild(opt);
            sel.selectedIndex = 0;
            sel.disabled = true;
            var lbl = sel.previousElementSibling;
            if (lbl && lbl.tagName === 'LABEL') lbl.textContent = 'Проходить (підтверджено порталом):';
            note('&#10004; Особу підтверджено порталом.', '#047857');
        }

        function toPlain(html) {
            var d = document.createElement('div');
            d.innerHTML = html;
            return (d.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function deny(text) {
            var sel = document.getElementById('employeeSelect');
            if (sel) {
                sel.innerHTML = '<option value="">-- вхід тільки з порталу --</option>';
                sel.disabled = true;
            }
            window.startTest = function () { alert(toPlain(text)); };
            note(text, '#b91c1c');
        }

        function needPortal() {
            return 'Тест відкривається тільки з порталу працівника. ' +
                   'Зайдіть на <a href="' + PORTAL_URL + '" style="color:#047857;font-weight:bold;">портал</a> ' +
                   '&rarr; «Тести» і відкрийте тест звідти.';
        }

        ready(function () {
            if (!pt) {
                if (REQUIRE_PORTAL) deny(needPortal());
                return; // старий режим — список ПІБ лишається як був
            }
            fetch(PORTAL_API, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ requestType: 'resolve_test_token', pt: pt })
            })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d && d.user) {
                    lockTo(d.user);
                } else if (REQUIRE_PORTAL) {
                    deny('Посилання застаріло або вже використане. ' + needPortal());
                } else {
                    note('Не вдалося підтвердити особу через портал — оберіть ПІБ вручну.', '#b45309');
                }
            })
            .catch(function () {
                if (REQUIRE_PORTAL) deny('Немає зв\'язку з порталом. Спробуйте ще раз.');
                else note('Немає зв\'язку з порталом — оберіть ПІБ вручну.', '#b45309');
            });
        });
    })();
    </script>

</body>
