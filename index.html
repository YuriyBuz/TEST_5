<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оцінка Компетенцій: Контролер Якості (Виробництво Соусів)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --primary: #0284c7; --danger: #dc2626; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; padding-bottom: 2rem; }
        .card { background-color: var(--card-bg); border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .option-btn { transition: all 0.2s; border: 2px solid #e2e8f0; position: relative; }
        .option-btn:not(.disabled):hover { border-color: var(--primary); background-color: #f0f9ff; }
        .option-btn.correct-choice { border-color: var(--primary) !important; background-color: #e0f2fe !important; }
        .option-btn.wrong-choice { border-color: var(--danger) !important; background-color: #fef2f2 !important; }
        .option-btn.disabled { cursor: default; opacity: 0.7; }
        .feedback-box { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
        .spinner { animation: rotate 2s linear infinite; width: 16px; height: 16px; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="container mx-auto max-w-2xl p-4 sm:p-6">
        <header class="text-center mb-6 pt-4">
            <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt="Логотип" class="w-24 h-auto mx-auto mb-4 rounded-xl shadow-sm bg-white p-1" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23eee\'/><text x=\'50\' y=\'50\' font-family=\'Arial\' font-size=\'14\' text-anchor=\'middle\' dy=\'.3em\' fill=\'%23999\'>Logo</text></svg>'">
            <div class="flex items-center justify-center gap-2 mb-1">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-green-500"></div>
                <span id="statusText" class="text-xs font-bold text-slate-500 uppercase tracking-widest">Онлайн</span>
            </div>
            <h1 class="text-2xl font-bold text-sky-800">Атестація: Контролер Якості</h1>
            <p class="text-slate-500 text-sm">Виробництво соусів | Лабораторія, HACCP, Санітарія</p>
        </header>

        <div id="step-login" class="card p-6 rounded-2xl">
            <div class="bg-sky-50 border-l-4 border-sky-500 p-4 mb-6">
                <h3 class="font-bold text-sky-800 text-sm">Інформація:</h3>
                <p class="text-xs text-sky-700 mt-1">Тестування містить профільні задачі підвищеної складності (8.5/10). Результати записуються в базу. Прохідний бал: 18 правильних відповідей з 20.</p>
            </div>
            <label class="block text-sm font-bold mb-2 text-slate-700">Оберіть ПІБ:</label>
            <select id="employeeSelect" class="w-full p-3 border border-gray-300 rounded-xl bg-white text-lg focus:outline-none focus:ring-2 focus:ring-sky-500 mb-6"><option value="">-- Натисніть для вибору --</option></select>
            <button onclick="startTest()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95">РОЗПОЧАТИ ОЦІНКУ</button>
        </div>

        <div id="step-quiz" class="hidden">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-xs font-bold text-slate-400 uppercase">Питання <span id="q-current">1</span> / <span id="q-total-counter">0</span></span>
                <div class="w-1/2 bg-gray-200 rounded-full h-2"><div id="progress-bar" class="bg-sky-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div></div>
            </div>
            <div class="card p-6 rounded-2xl min-h-[420px] flex flex-col justify-between">
                <div>
                    <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-800 leading-tight"></h2>
                    <div id="options-container" class="space-y-3"></div>
                    <div id="feedback-container" class="hidden mt-6 feedback-box">
                        <div id="feedback-type" class="p-4 rounded-xl border-l-4">
                            <div class="flex items-center mb-1"><span id="feedback-icon" class="mr-2"></span><span id="feedback-title" class="font-bold"></span></div>
                            <p id="feedback-text" class="text-sm italic"></p>
                        </div>
                    </div>
                </div>
                <button id="next-btn" onclick="nextQuestion()" disabled class="mt-8 w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl cursor-not-allowed transition">Наступне питання</button>
            </div>
        </div>

        <div id="step-result" class="hidden text-center">
            <div class="card p-8 rounded-3xl">
                <div id="sync-indicator" class="mb-4 text-[10px] font-black uppercase tracking-tighter text-amber-500 flex items-center justify-center gap-2"><span>Синхронізація...</span><div class="spinner border-2 border-amber-500 border-t-transparent rounded-full"></div></div>
                <div id="icon-result" class="text-6xl mb-4"></div>
                <h2 id="title-result" class="text-3xl font-bold mb-1"></h2>
                <div class="py-6 my-4 border-y border-slate-100"><p class="text-5xl font-black text-slate-800"><span id="score-val">0</span> / <span id="score-total">0</span></p><p id="percentage-val" class="text-sm font-bold text-sky-600 mt-2 bg-sky-50 inline-block px-3 py-1 rounded-full"></p></div>
                <p id="msg-result" class="text-base mb-8 px-4 text-slate-500 leading-relaxed"></p>
                <div class="mb-8 flex justify-center"><div id="qrcode" class="p-2 bg-white border rounded-xl"></div></div>
                <button onclick="location.reload()" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition">Повернутися на головну</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkzOkyk2zwObyZThhZE1ACAPYAtwPMZsSoUij9yHw_vEKgmkImUOCVlk-F_SH06b_w/exec';
        const OFFLINE_QUEUE_KEY = 'sauce_safety_offline_queue_qc';
        
        const employeesList = [
            "Соботович Л.М.", "Огаркова М.В.", "Попадюк А.М."
        ];

        // 20 запитань (складність 8.5/10)
        const originalQuestions = [
            { q: "Вхідний контроль: Brix партії томатної пасти становить 34 замість 36 за специфікацією. Ваші дії?", a: ["Прийняти партію в роботу, оскільки на варці соус все одно уварюється.", "Забракувати сировину, або прийняти виключно за процедурою тимчасового відхилення з оцінкою ризиків.", "Прийняти і повідомити варника, щоб додав менше води згідно з пропорцією."], ci: 1, h: "Сировина, що не відповідає специфікації, не може бути прийнята 'на око'. Тільки офіційна процедура відхилення з підписом відповідальних осіб гарантує контроль витрат і якості." },
            { q: "ХВО: Жорсткість води після натрій-катіонітового пом'якшувального фільтра раптово зросла з 0.1 до 1.5 мг-екв/л. Який головний ризик для виробництва майонезу?", a: ["Відбудеться швидке утворення накипу в трубах та пастеризаторі.", "Іони кальцію та магнію можуть призвести до руйнування емульсії (синерезис/розшарування).", "Майонез стане занадто густим через реакцію з крохмалем."], ci: 1, h: "Солі жорсткості негативно впливають на стабільність жироводних емульсій. Це критичний параметр для майонезної групи." },
            { q: "Фіз-хімія (рН): Під час вимірювання рН густого майонезного соусу покази на рН-метрі постійно 'плавають' і не стабілізуються. Ваша найімовірніша дія для отримання точного результату?", a: ["Розбавити зразок нейтральною дистильованою водою у співвідношенні 1:10, ретельно перемішати та виміряти.", "Сильно збовтати соус і швидко занурити електрод, поки він не розшарувався.", "Збільшити температуру зразка до 50°C для зменшення в'язкості і пришвидшення реакції."], ci: 0, h: "Густі жирові емульсії обволікають електрод, що блокує обмін іонів. Для точного вимірювання рН за ДСТУ/ISO такі продукти розбавляють дистильованою водою (1:10 або 1:1), що вивільняє іони водню." },
            { q: "Санітарія (змиви): Після CIP-мийки ви перевіряєте промивну воду індикаторними рН-смужками на залишки лугу. Підготовлена вода має рН 7.0, а змивна вода з котла показує рН 8.5. Ваші дії?", a: ["Дозволити запуск, оскільки рН 8.5 є слабколужним і безпечним для харчових продуктів.", "Провести додаткове промивання чистою водою, поки рН змивної води не зрівняється з рН води з крана (7.0).", "Обробити котел слабким розчином лимонної кислоти, щоб збити рН до 7.0."], ci: 1, h: "Значення рН останньої промивної води повинно точно відповідати рН чистої води, що подається на підприємство. Будь-яке відхилення свідчить про наявність залишків мийних засобів." },
            { q: "Облік хімії: Оператор цеху просить налити йому 2 літри азотної кислоти у звичайне пластикове відро для локального відмивання сильних забруднень підлоги. Ваше рішення?", a: ["Не видати. Азотна кислота призначена для CIP-миття, не для ручного, а тара має бути спеціальною та маркованою.", "Видати, але провести інструктаж з техніки безпеки та змусити вдягнути окуляри.", "Видати, але в скляній тарі, щоб пластик не розплавився."], ci: 0, h: "Категорично заборонено використовувати CIP-кислоти для відкритого ручного миття (високий ризик опіків парами/рідиною) та використовувати немарковану/невідповідну тару." },
            { q: "Контроль на лінії (Фасування): Під час фасування соусу в пакет 'Дой-пак' ви помітили, що зварний шов має мікроскладки (зморшки), хоча герметичність при натисканні рукою не порушена.", a: ["Пропустити партію, оскільки ручний тест на стискання є достатнім підтвердженням герметичності.", "Зупинити лінію, відбракувати продукцію. Мікроскладки — це ризик капілярного протікання та мікробіологічного псування.", "Збільшити температуру зварювальних губок на 20°C і продовжити фасування без зупинки."], ci: 1, h: "Мікроскладки на шві (канали) є критичним дефектом пакування. Навіть якщо пакет не тече одразу, через капілярний ефект всередину можуть потрапити мікроорганізми з навколишнього середовища." },
            { q: "Органолептика: Всі лабораторні показники (pH, Brix, в'язкість) нової партії кетчупу в нормі, але ви відчуваєте сторонній гіркуватий присмак. Що робити?", a: ["Дати дозвіл на фасування, оскільки всі специфіковані приладами параметри в межах норми.", "Заблокувати партію, зібрати дегустаційну комісію (мінімум 3 особи) для сліпого порівняння з еталонним зразком.", "Додати цукровий сироп у танк, щоб замаскувати гіркоту."], ci: 1, h: "Органолептика є таким же повноцінним показником якості, як і фізико-хімія. При відхиленні потрібне колегіальне рішення комісії." },
            { q: "Вихідний контроль: На складі готової продукції виявлено палету майонезу, де на 5 коробках змазане струйне маркування (не читається дата і номер партії).", a: ["Відвантажити палету, оскільки загальний штрих-код на самій палеті читається чудово.", "Заблокувати палету в системі (статус 'БРАК'/'КАРАНТИН'), відправити на перемаркування/перепакування дефектних коробок.", "Власноруч написати дати маркером на коробках."], ci: 1, h: "Відсутність чіткого маркування на споживчій або груповій тарі руйнує простежуваність (traceability), що є порушенням ISO 22000 / IFS." },
            { q: "В'язкість (Боствік): В'язкість гарячого соусу знаходиться на верхній межі норми (дуже густий). Варник пропонує додати води, щоб 'вирівняти' партію.", a: ["Заборонити. В'язкість соусів з гідроколоїдами після охолодження (стабілізації) значно зміниться, орієнтуватися треба на профіль холодної дегустації.", "Дозволити, оскільки додання води на етапі гарячого варіння не впливає на мікробіологію.", "Заборонити воду, але дозволити додати додаткову дозу крохмалю."], ci: 0, h: "Гаряча в'язкість — це лише технологічний орієнтир. Рішення про розведення приймається тільки технологом на основі кореляції гарячого/холодного зразка." },
            { q: "Контроль ваги (Нетто): Під час перевірки ваги фасованого соусу ви виявили, що середня вага партії в нормі, але дві упаковки з десяти мають недолив більший за межу (подвійна похибка). Ваше рішення?", a: ["Продовжити фасування, оскільки середня вага партії відповідає нормі.", "Зупинити лінію, відбракувати всю вироблену з останньої перевірки партію, переналаштувати дозатор.", "Просто додати по 5 грамів у наступні 10 упаковок для вирівнювання загального балансу."], ci: 1, h: "За правилами фасування (Директива 76/211/ЄЕС/e-mark), наявність упаковок з недоливом нижче межі є критичною невідповідністю. Партія підлягає блокуванню." },
            { q: "Мікробіологія: Під час термостатної проби (при 37°C) одного зразка 'Дой-пак' на 3-й день виявлено здуття (бомбаж), без зміни запаху.", a: ["Це нормальне розширення повітряної подушки при нагріванні, продовжити тест до 7 днів.", "Заблокувати партію, зразки направити на глибокий мікробіологічний посів (підозра на розвиток газоутворюючих бактерій або дріжджів).", "Проколоти упаковку голкою в лабораторії, щоб випустити газ і перевірити рН."], ci: 1, h: "Здуття упаковки в термостаті — перша ознака мікробіологічного псування (напр. молочнокислі бактерії або дріжджі). Партія потенційно небезпечна." },
            { q: "Вхідний контроль (Документація): Приймаючи партію сухого часнику, ви виявили, що в Сертифікаті аналізу (CoA) відсутній показник тестування на сальмонелу, який є обов'язковим за вашою специфікацією.", a: ["Прийняти сировину, але зробити внутрішній експрес-тест на сальмонелу перед її використанням.", "Перевести партію в статус 'Карантин', терміново зробити запит постачальнику на оновлений CoA з результатами мікробіології.", "Забракувати партію і негайно повернути машину постачальнику без можливості надання додаткових документів."], ci: 1, h: "Відсутність критичного показника безпеки у супровідній документації не дозволяє випустити сировину у виробництво. Вона має бути заблокована (карантин) до з'ясування обставин." },
            { q: "Контроль процесів (Майонез): При відборі проби готового майонезного соусу ви помітили високу 'завоздушеність' (наявність дрібних бульбашок повітря в структурі). Який основний ризик це несе?", a: ["Пришвидшене окислення жирів (згіркнення) та потенційний недолив у грамах при об'ємному фасуванні через зменшення щільності.", "Повітря буде сприяти розмноженню небезпечних анаеробних бактерій всередині упаковки.", "Майонез стане більш густим, що утруднить його видавлювання з упаковки споживачем."], ci: 0, h: "Завоздушеність майонезу є серйозним дефектом: кисень спричиняє окислення олії (псування смаку), а бульбашки зменшують питому вагу, через що об'ємний дозатор наллє меншу вагу нетто." },
            { q: "Санітарія (Алергени): Після переходу лінії з кунжутного соусу (містить алерген) на томатний (без алергену) виявлено дві насінини кунжута в ВК. Дії?", a: ["Запустити лінію, але перші 50 кг томатного соусу злити в каністри на переварку.", "Заблокувати запуск. Провести повторне миття проблемних вузлів обладнання до отримання повністю чистого обладнання.", "Додати в воду для повторої мийки азотну кислоту для розкладання білків кунжуту."], ci: 1, h: "Залишки алергенів неможливо 'злити' або 'знешкодити'. Потрібне виключно ретельне фізико-хімічне змивання (CIP) та підтвердження тестом." },
            { q: "Облік засобів: При звірці залишків у кінці зміни виявлено нестачу 2 літрів концентрованої надоцтової кислоти (НОК).", a: ["Списати це як природний убуток (випаровування).", "Негайно ініціювати розслідування: є серйозний ризик несанкціонованого використання, розливу або саботажу хімією.", "Долити 2 літри води в каністру, щоб зійшовся об'єм перед передачею зміни."], ci: 1, h: "Контроль хімікатів (Хімічна безпека/Food Defense) вимагає суворого балансу. Втрата концентрату — це надзвичайна подія." },
            { q: "Контроль процесів (Охолодження): Через поломку насоса готовий кетчуп (85°C) стоїть у накопичувальній ємності вже 2 години без охолодження. Який ризик?", a: ["Продукт стане занадто рідким через повне руйнування крохмалю.", "Відбудеться реакція Майяра та карамелізація — соус потемніє, з'явиться горілий присмак ('тепловий удар').", "Збільшиться ризик розвитку термофільних бактерій."], ci: 1, h: "Тривалий вплив високих температур після варіння призводить до так званого 'теплового удару'. Продукт змінює колір на темний і набуває присмаку паленого цукру (реакція Майяра)." },
            { q: "Вихідний контроль (Транспорт): Влітку прибув рефрижератор для завантаження майонезу. Температура в кузові +28°C (вимога: 0...+18°C).", a: ["Завантажити якнайшвидше, майонез у палетах не встигне нагрітися.", "Завантажити, але зробити відмітку в ТТН для клієнта.", "Відмовити в завантаженні, заблокувати доки водій не увімкне установку і кузов не охолодиться до специфікованої температури."], ci: 2, h: "Завантаження в 'гарячий' кузов заборонено температурним протоколом, оскільки майонез вкрай чутливий до перегріву (втрата емульсії)." },
            { q: "Фіз-хімія: рН готового майонезу в танку 4.4 (при нормі макс. 4.2). Варник пропонує просто долити оцтову кислоту в танк і перемішати лопастною мішалкою.", a: ["Так, це стандартна і швидка практика коригування.", "Ні. Введення кислоти в готову емульсію без гомогенізатора зруйнує структуру (розшарування). Партія є невідповідною і підлягає переробці за протоколом.", "Можна, якщо разом з кислотою додати сухий яєчний жовток."], ci: 1, h: "Майонез (емульсія типу олія-у-воді) дуже чутливий до локальних змін рН. Просте вливання кислоти 'спалить' емульгатор, що призведе до виділення олії." },
            { q: "Санітарія та Безпека (Скло): Під час фасування соусу в скляні пляшки одна з них розбилася на конвеєрі під наповнювачем. Який алгоритм дій контролера якості?", a: ["Зупинити машину, прибрати скло щіткою, протерти конвеєр вологою ганчіркою і запустити лінію.", "Змити уламки скла водою зі шланга під тиском безпосередньо в трап і продовжити роботу.", "Зупинити лінію, ізолювати продукцію в радіусі згідно з процедурою, очистити зону спец. інвентарем (червоного кольору), забракувати всю відкриту тару в цій зоні."], ci: 2, h: "Процедура управління биттям скла вимагає повної зупинки, блокування прилеглої продукції (через ризик розльоту мікроуламків) та використання виділеного інвентарю для прибирання." },
            { q: "Документація (HACCP): Ви помітили, що варник переписує показники температурних режимів за всю зміну в завдання на варку 'по пам'яті' за 10 хвилин до кінця зміни.", a: ["Це не проблема, якщо дані в комп'ютері (ПЛК) відповідають нормі.", "Категорично заборонити. Це фальсифікація записів (порушення Food Safety Culture). Моніторинг ККТ має здійснюватися в режимі реального часу.", "Допомогти йому згадати правильні цифри, щоб швидше здати зміну."], ci: 1, h: "Заповнення завдань на варку 'заднім числом' є найгрубішим порушенням принципів HACCP і може стати причиною позбавлення сертифіката (IFS/FSSC)." }
        ];

        let currentQIndex = 0, score = 0, userName = "", selectedOptionIndex = null, testLog = [], currentOptions = [];

        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('employeeSelect');
            employeesList.sort((a, b) => a.localeCompare(b, 'uk')).forEach(name => { 
                const opt = document.createElement('option'); 
                opt.value = name; 
                opt.textContent = name; 
                select.appendChild(opt); 
            });
            document.getElementById('q-total-counter').innerText = originalQuestions.length;
            
            updateNetworkStatus();
            window.addEventListener('online', () => { updateNetworkStatus(); processOfflineQueue(); });
            window.addEventListener('offline', updateNetworkStatus);
        });

        function shuffle(a) { 
            for (let i = a.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [a[i], a[j]] = [a[j], a[i]]; 
            } 
            return a; 
        }

        function startTest() { 
            userName = document.getElementById('employeeSelect').value; 
            if (!userName) { alert("Будь ласка, оберіть ПІБ зі списку."); return; } 
            document.getElementById('step-login').classList.add('hidden'); 
            document.getElementById('step-quiz').classList.remove('hidden'); 
            renderQuestion(); 
        }

        function renderQuestion() {
            const q = originalQuestions[currentQIndex];
            document.getElementById('q-current').innerText = currentQIndex + 1;
            document.getElementById('progress-bar').style.width = `${(currentQIndex / originalQuestions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('feedback-container').classList.add('hidden');
            
            const container = document.getElementById('options-container'); 
            container.innerHTML = '';
            
            const nextBtn = document.getElementById('next-btn'); 
            nextBtn.disabled = true;
            nextBtn.className = "mt-8 w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl cursor-not-allowed transition";
            nextBtn.innerText = currentQIndex === originalQuestions.length - 1 ? "Завершити тестування" : "Наступне питання";
            
            currentOptions = q.a.map((text, i) => ({ text, isCorrect: i === q.ci }));
            shuffle(currentOptions);
            
            currentOptions.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl text-lg flex items-center mb-2 leading-tight';
                btn.innerHTML = `<span class="w-8 h-8 rounded-full border-2 border-slate-200 flex-shrink-0 flex items-center justify-center mr-3 text-xs font-bold text-slate-400">${String.fromCharCode(65 + i)}</span> <span>${opt.text}</span>`;
                btn.onclick = () => showFeedback(i, btn);
                container.appendChild(btn);
            });
        }

        function showFeedback(idx, btn) {
            if (selectedOptionIndex !== null) return;
            selectedOptionIndex = idx;
            const isCorrect = currentOptions[idx].isCorrect;
            
            if (isCorrect) { 
                score++; 
                btn.classList.add('correct-choice'); 
                testLog.push('✅'); 
            } else { 
                btn.classList.add('wrong-choice'); 
                testLog.push('❌'); 
                document.querySelectorAll('.option-btn').forEach((b, i) => { 
                    if (currentOptions[i].isCorrect) b.classList.add('correct-choice'); 
                }); 
            }
            
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
            
            const fbox = document.getElementById('feedback-container');
            const ftype = document.getElementById('feedback-type');
            const ficon = document.getElementById('feedback-icon');
            const ftitle = document.getElementById('feedback-title');
            const ftext = document.getElementById('feedback-text');
            
            fbox.classList.remove('hidden'); 
            ftext.innerText = originalQuestions[currentQIndex].h;
            
            if (isCorrect) { 
                ftype.className = "p-4 rounded-xl border-l-4 border-sky-500 bg-sky-50 text-sky-800"; 
                ficon.innerText = "✅"; 
                ftitle.innerText = "Абсолютно вірно!"; 
            } else { 
                ftype.className = "p-4 rounded-xl border-l-4 border-red-500 bg-red-50 text-red-800"; 
                ficon.innerText = "❌"; 
                ftitle.innerText = "Помилка контролю!"; 
            }
            
            const nextBtn = document.getElementById('next-btn'); 
            nextBtn.disabled = false; 
            nextBtn.className = "mt-8 w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95";
        }

        function nextQuestion() { 
            selectedOptionIndex = null; 
            currentQIndex++; 
            if (currentQIndex < originalQuestions.length) renderQuestion(); 
            else showResults(); 
        }

        function showResults() {
            document.getElementById('step-quiz').classList.add('hidden'); 
            document.getElementById('step-result').classList.remove('hidden');
            
            const total = originalQuestions.length;
            const pct = Math.round((score / total) * 100);
            const passed = score >= 18; // 18 з 20 для проходження
            
            document.getElementById('score-val').innerText = score; 
            document.getElementById('score-total').innerText = total;
            document.getElementById('percentage-val').innerText = `${pct}% Правильних відповідей`;
            
            const icon = document.getElementById('icon-result');
            const title = document.getElementById('title-result');
            const msg = document.getElementById('msg-result');
            
            if (passed) { 
                icon.innerText = "🔬"; 
                title.innerText = "Компетенцію Підтверджено"; 
                title.className = "text-3xl font-black mb-1 text-sky-600"; 
                msg.innerText = "Чудова робота! Ви продемонстрували високий рівень знань політик якості, HACCP та лабораторного контролю. Дані збережено."; 
            } else { 
                icon.innerText = "⚠️"; 
                title.innerText = "Атестацію Не Складено"; 
                title.className = "text-3xl font-black mb-1 text-red-600"; 
                msg.innerText = `Цільовий бал: 18. Ваш результат: ${score}. Рекомендується повторне вивчення стандартів підприємства та політик харчової безпеки перед перездачею.`; 
            }
            
            const payload = { 
                formType: 'QC_INSPECTOR_COMPETENCY', 
                name: userName, 
                score: score, 
                total: total, 
                percent: pct, 
                passed: passed, 
                details: testLog.join(' '), 
                date: new Date().toISOString() 
            };
            
            sendToGAS(payload);
            
            const qrText = `QC_AUTH:${userName}|${score}/${total}|${passed?'PASS':'FAIL'}|${testLog.join('')}`;
            try { 
                new QRCode(document.getElementById("qrcode"), { text: qrText, width: 140, height: 140, correctLevel : QRCode.CorrectLevel.L }); 
            } catch (e) { console.error("QR Code Error:", e); }
        }

        function sendToGAS(p) {
            if (!navigator.onLine) { saveToOffline(p); return; }
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) })
            .then(() => document.getElementById('sync-indicator').innerHTML = '<span class="text-sky-500 font-bold uppercase tracking-widest text-[10px]">✅ Збережено на сервер</span>')
            .catch(() => saveToOffline(p));
        }

        function saveToOffline(p) { 
            const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); 
            q.push(p); 
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); 
            document.getElementById('sync-indicator').innerHTML = '<span class="text-amber-500 font-bold uppercase tracking-widest text-[10px]">📵 Збережено офлайн (чекаємо інтернет)</span>'; 
        }

        async function processOfflineQueue() {
            if (!navigator.onLine) return; 
            const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); 
            if (q.length === 0) return;
            
            document.getElementById('sync-indicator').innerHTML = '<span class="text-amber-500 font-bold uppercase tracking-widest text-[10px]">Синхронізація офлайн даних...</span>';
            for (const p of [...q]) { 
                try { 
                    await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) }); 
                    q.shift(); 
                } catch (e) { break; } 
            }
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); 
            updateNetworkStatus();
            document.getElementById('sync-indicator').innerHTML = '<span class="text-sky-500 font-bold uppercase tracking-widest text-[10px]">✅ Всі дані синхронізовано</span>';
        }

        function updateNetworkStatus() { 
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText'); 
            if (!navigator.onLine) { 
                dot.className = 'w-2 h-2 rounded-full bg-red-500'; 
                txt.textContent = 'Офлайн'; 
            } else { 
                dot.className = 'w-2 h-2 rounded-full bg-green-500'; 
                txt.textContent = 'Онлайн'; 
            } 
        }
    </script>
</body>
</html>
